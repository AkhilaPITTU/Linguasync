services:
  - type: web
    name: linguasync-backend
    runtime: python
    rootDir: backend
    buildCommand: python -m pip install --no-cache-dir -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: ENVIRONMENT
        value: production
